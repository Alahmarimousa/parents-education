name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache-bust asset URLs
        # Assets are referenced by bare path, so a returning phone keeps serving
        # the JS and CSS it already has and never sees an update. Stamping the
        # commit sha onto each URL at publish time makes every deploy a new URL.
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href=\"css/[^\"?]+\.css)\"#\1?v=$V\"#g; s#(src=\"js/[^\"?]+\.js)\"#\1?v=$V\"#g" index.html
          echo "stamped assets with v=$V"
          grep -E 'css/styles|js/app\.js' index.html
      - name: Strip internal files from the published site
        # The whole checkout is uploaded, so anything left here is publicly
        # downloadable. docs/ holds clinical review material (the surgeon's
        # returned worksheet, correction records) and tools/ is the build
        # scripts - neither belongs on a parent-facing site.
        run: rm -rf docs tools
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
